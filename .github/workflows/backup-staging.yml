name: Daily staging backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backup-staging.yml"
      - "backend/scripts/backup-rtdb.mjs"
      - "backend/scripts/verify-backup-restore.mjs"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: staging
      FIREBASE_DATABASE_URL: ${{ secrets.STAGING_FIREBASE_DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
      GCLOUD_PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.STAGING_BACKUP_ENCRYPTION_KEY }}
      BACKUP_ENCRYPT: true
      BACKUP_OUTPUT_DIR: ./backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: Verify staging configuration
        working-directory: backend
        run: |
          node --input-type=module <<'NODE'
          import { encryptBackup } from './scripts/backup-crypto.mjs';
          const project = 'control-seguridad-staging';
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT || '';
          let account;
          try { account = JSON.parse(raw.trim().startsWith('{') ? raw : Buffer.from(raw, 'base64').toString()); }
          catch { throw Error('Missing or invalid STAGING_FIREBASE_SERVICE_ACCOUNT'); }
          if (account.project_id !== project || !account.private_key || process.env.GCLOUD_PROJECT !== project ||
              new URL(process.env.FIREBASE_DATABASE_URL).href !== 'https://' + project + '-default-rtdb.firebaseio.com/')
            throw Error('Project and credentials must match staging');
          encryptBackup({ check: true });
          NODE
      - name: Run encrypted redacted backup
        timeout-minutes: 5
        working-directory: backend
        run: node scripts/backup-rtdb.mjs --encrypt=true --output=./backups --file="rtdb-${GITHUB_RUN_ID}.json"
      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: staging-rtdb-backup-${{ github.run_id }}
          path: backend/backups/rtdb-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global firebase-tools@14.25.0
      - name: Restore and compare in isolated emulator
        timeout-minutes: 6
        working-directory: backend
        env:
          FIREBASE_SERVICE_ACCOUNT: ""
          GCLOUD_PROJECT: demo-backup-restore
          NODE_ENV: test
        run: firebase emulators:exec --only database --project demo-backup-restore "node scripts/verify-backup-restore.mjs ./backups/rtdb-${GITHUB_RUN_ID}.json"
      - name: Apply scheduled retention after verified recovery
        if: github.event_name == 'schedule'
        timeout-minutes: 5
        working-directory: backend
        run: node scripts/retention-rtdb.mjs --retention-days=90 --apply=true

  alert:
    permissions:
      issues: write
    needs: backup
    if: ${{ always() && needs.backup.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Alert failed backup
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Backup staging fallido: ${context.run_id}`,
              body: `El scheduler de respaldo staging fallo. Revisar la ejecucion ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.run_id}.`
            });
