name: Daily staging backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: staging
      FIREBASE_DATABASE_URL: ${{ secrets.STAGING_FIREBASE_DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}
      GCLOUD_PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.STAGING_BACKUP_ENCRYPTION_KEY }}
      BACKUP_ENCRYPT: true
      JWT_SECRET: ci-placeholder-not-used
      QR_SECRET: ci-placeholder-not-used
      ALLOWED_ORIGINS: https://staging.control-seguridad.example
      BACKUP_OUTPUT_DIR: ./backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: Run encrypted redacted backup
        working-directory: backend
        run: node scripts/backup-rtdb.mjs --encrypt=true --output=./backups --file="rtdb-${GITHUB_RUN_ID}.json"
      - name: Apply retention
        working-directory: backend
        run: node scripts/retention-rtdb.mjs --retention-days=90 --apply=true > ./backups/retention-${GITHUB_RUN_ID}.json
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-rtdb-backup-${{ github.run_id }}
          path: backend/backups
          retention-days: 30
      - name: Alert failed backup
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Backup staging fallido: ${context.run_id}`,
              body: `El scheduler de respaldo staging fallo. Revisar la ejecucion ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.run_id}.`
            });
